<!-- countdown.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>⏳ Countdown Timer</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        color: #333;
        text-align: center;
      }

      input {
        padding: 12px;
        width: 150px;
        font-size: 1em;
        border-radius: 10px;
        border: 2px solid #ccc;
        margin: 5px;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      input:focus {
        border-color: #ff5722;
        box-shadow: 0 0 8px rgba(255, 87, 34, 0.4);
      }

      button {
        padding: 10px 20px;
        font-size: 1em;
        border: none;
        border-radius: 25px;
        background: #ff5722;
        color: white;
        cursor: pointer;
        margin: 5px;
        transition: background 0.3s, transform 0.2s;
      }

      button:hover {
        background: #e64a19;
        transform: scale(1.05);
      }

      #display {
        font-size: 3em;
        margin-top: 30px;
        padding: 20px 40px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s;
      }

      #display.warning {
        color: #fff;
        background: #f44336;
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <h1>⏳ Countdown Timer</h1>
    <input id="time" type="number" placeholder="Seconds" />
    <div>
      <button onclick="start()">Start</button>
      <button onclick="reset()">Reset</button>
    </div>
    <h1 id="display">0s</h1>

    <script>
      let timer = null;
      let t = 0;

      function start() {
        const inputTime = parseInt(time.value);
        if (isNaN(inputTime) || inputTime <= 0) {
          alert("Please enter a valid number of seconds!");
          return;
        }

        clearInterval(timer);
        t = inputTime;
        updateDisplay();

        timer = setInterval(() => {
          t--;
          updateDisplay();
          if (t < 0) {
            clearInterval(timer);
            display.textContent = "⌛ Time’s up!";
            display.classList.remove("warning");
          }
        }, 1000);
      }

      function reset() {
        clearInterval(timer);
        t = 0;
        display.textContent = "0s";
        display.classList.remove("warning");
        time.value = "";
      }

      function updateDisplay() {
        display.textContent = t + "s left";
        if (t <= 5 && t > 0) {
          display.classList.add("warning");
        } else {
          display.classList.remove("warning");
        }
      }
    </script>
  </body>
</html>
